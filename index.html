<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <div class="header">
            <div>
                <p class="small-title">MY PRODUCTIVITY</p>
                <h1>My To-Do List</h1>
                <p class="subtitle">Organize your day, one task at a time.</p>
            </div>

            <div class="date" id="date"></div>
        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-card">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Total Tasks</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">Completed</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="remainingTasks">0</span>
                <span class="stat-label">Remaining</span>
            </div>

        </div>

        <!-- Progress -->
        <div class="progress-section">

            <div class="progress-info">
                <span>Today's Progress</span>
                <span id="progressText">0%</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

        </div>

        <!-- Add Task -->
        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="What do you need to accomplish?"
                autocomplete="off"
            >

            <button onclick="addTask()" class="add-button">
                <span>+</span>
                Add Task
            </button>

        </div>

        <!-- Task List -->
        <div class="tasks-container">

            <div class="tasks-header">
                <h2>My Tasks</h2>
                <button onclick="clearCompleted()" class="clear-btn">
                    Clear Completed
                </button>
            </div>

            <ul id="taskList"></ul>

            <div id="emptyMessage" class="empty-message">
                <div class="empty-icon">✓</div>
                <h3>No tasks yet</h3>
                <p>Add a task above to get started!</p>
            </div>

        </div>

        <footer>
            Stay organized • Stay productive
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
